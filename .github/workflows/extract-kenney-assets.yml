name: Extract Kenney Assets

on:
  push:
    branches: [main]
    paths:
      - ".github/asset-extraction-trigger.txt"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Kenney art packs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Assets/Art/Kenney/PlatformerArtExtended
          mkdir -p Assets/Art/Kenney/PlatformerCharacters
          unzip -o kenney_platformer-art-extended-tileset.zip -d Assets/Art/Kenney/PlatformerArtExtended
          unzip -o kenney_platformer-characters.zip -d Assets/Art/Kenney/PlatformerCharacters

      - name: Commit extracted assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Art/Kenney
          if git diff --cached --quiet; then
            echo "No extracted asset changes to commit."
          else
            git commit -m "Import Kenney platformer art assets"
            git push
          fi
