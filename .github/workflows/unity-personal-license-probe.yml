name: Unity Personal License Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/unity-personal-license-probe.yml"

permissions:
  contents: read

jobs:
  request-activation-file:
    name: Test cloud activation request generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Request Unity activation file
        id: activation
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-Request
          path: ${{ steps.activation.outputs.filePath }}
          retention-days: 7
