name: Unity Personal License Probe

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Choose whether to generate an ALF request or run the Android build"
        required: true
        type: choice
        default: request-activation
        options:
          - request-activation
          - build
  push:
    paths:
      - ".github/workflows/unity-personal-license-probe.yml"

permissions:
  contents: read

jobs:
  request-activation-file:
    name: Generate Unity manual activation request (.alf)
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'request-activation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate manual activation file
        id: activation
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload ALF request
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Manual-Activation-Request
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
          retention-days: 7

      - name: Explain next steps
        shell: bash
        run: |
          {
            echo "## Unity activation request generated"
            echo
            echo "Download the Unity-Manual-Activation-Request artifact from this workflow run."
            echo "Submit the .alf file to Unity's license activation portal to request a license response."
            echo
            echo "Important: Unity's current documentation says manual .alf activation does not support Unity Personal. This workflow can generate and deliver the request file, but Unity may not issue a Personal .ulf from it."
          } >> "$GITHUB_STEP_SUMMARY"

  check-personal-license:
    name: Check Unity Personal licensing and build Android APK
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.task == 'build')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check required GitHub secrets without exposing values
        id: secrets
        shell: bash
        env:
          HAS_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
          HAS_UNITY_EMAIL: ${{ secrets.UNITY_EMAIL != '' }}
          HAS_UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD != '' }}
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            var="HAS_${name}"
            if [[ "${!var}" != "true" ]]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            {
              echo "## Unity Personal license test"
              echo
              echo "The build did not start because one or more required repository secrets are missing."
              echo "Add UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD under Settings → Secrets and variables → Actions."
              echo "Unity Personal manual activation compatibility is not guaranteed; see the activation request job and Unity's current licensing documentation."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All three required secrets are present (values were not printed)."

      - name: Build Android APK using current GameCI builder
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          allowDirtyBuild: false

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Platformer-Game-Pixel-Android-APK
          path: build/Android/**/*.apk
          if-no-files-found: error
          retention-days: 7
